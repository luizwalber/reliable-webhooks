# Local integration-test infra — NOT the runtime docker-compose.yml from
# docs/adr/0011-docker-compose-topology.md (that one doesn't exist yet and
# covers the whole app; this one is test-only, back_java-scoped).
#
# Reads credentials/ports from .env (gitignored — copy .env.example to
# .env first if you haven't). Docker Compose loads .env automatically
# from the directory it's run in.
#
# Bring up before `mvn test`:
#   docker compose -f docker-compose.test.yml up -d
# Tear down (drops data too):
#   docker compose -f docker-compose.test.yml down -v
#
# Ports and credentials match src/main/resources/application.yml's
# defaults exactly (same env var names), so no test-specific connection
# config is needed — see docs/adr/0014-docker-compose-test-seam.md for
# why this replaced Testcontainers.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # KRaft, single broker, matching docs/adr/0011-docker-compose-topology.md.
  # Dual listeners: PLAINTEXT for other containers on the compose network
  # (unused today — the test JVM runs on the host, not in a container),
  # PLAINTEXT_HOST for the host-side test JVM, advertised as localhost so
  # the client follows the right address after the initial bootstrap.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 3s
      timeout: 5s
      retries: 20
