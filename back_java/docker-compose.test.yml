# Local integration-test infra — NOT the runtime docker-compose.yml from
# docs/adr/0011-docker-compose-topology.md (that one doesn't exist yet and
# covers the whole app; this one is test-only, back_java-scoped).
#
# Reads credentials/ports from .env (gitignored — copy .env.example to
# .env first if you haven't). Docker Compose loads .env automatically
# from the directory it's run in.
#
# Bring up before `mvn test`:
#   docker compose -f docker-compose.test.yml up -d
# Tear down (drops data too):
#   docker compose -f docker-compose.test.yml down -v
#
# Ports and credentials match src/main/resources/application.yml's
# defaults exactly (same env var names), so no test-specific connection
# config is needed — see docs/adr/0014-docker-compose-test-seam.md for
# why this replaced Testcontainers.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
