spring:
  application:
    name: reliable-webhooks-backend
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:reliable_webhooks}
    username: ${POSTGRES_USER:reliable_webhooks}
    password: ${POSTGRES_PASSWORD:reliable_webhooks}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  flyway:
    enabled: true

server:
  port: 8080
  servlet:
    context-path: /v1
